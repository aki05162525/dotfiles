# 差分のフォーマット・静的解析を pre-commit で実行する。CI は使わない。
# hook は home-manager switch で登録する(home-manager/home.nix)。
# ビルド検証は重いため、更新後など必要なときに nix flake check を実行する。
# 秘密情報の検査も必要なときに trufflehog filesystem --no-update . を実行する。

pre-commit:
  parallel: true
  commands:
    nixfmt:
      glob: "*.nix"
      run: nixfmt --check {staged_files}
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}
    stylua:
      glob: "*.lua"
      run: stylua --check {staged_files}
